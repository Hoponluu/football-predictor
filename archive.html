<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive – World Cup Prediction</title>
    <link rel="icon" type="image/png" href="Favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="bracket.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        /* ── Header ── */
        .arc-header {
            background: var(--surface); border-bottom: 1px solid var(--stroke);
            padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }
        .arc-header-logo { font-size: 26px; }
        .arc-header-info { flex: 1; min-width: 0; }
        .arc-header-title { font-size: 17px; font-weight: 700; color: var(--text-primary); }
        .arc-header-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        /* ── Tabs ── */
        .arc-tabs {
            display: flex; background: var(--surface);
            border-bottom: 2px solid var(--stroke);
            padding: 0 20px; overflow-x: auto;
        }
        .arc-tab {
            padding: 11px 16px; font-size: 13px; font-weight: 600;
            color: var(--text-secondary); cursor: pointer; white-space: nowrap;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            transition: color .15s, border-color .15s;
        }
        .arc-tab:hover { color: var(--text-primary); }
        .arc-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* ── Group filter ── */
        .arc-group-bar {
            background: var(--bg); border-bottom: 1px solid var(--stroke);
            padding: 8px 20px; display: none; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .arc-group-label {
            font-size: 11px; font-weight: 700; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: .05em; margin-right: 2px;
        }
        .arc-group-btn {
            padding: 4px 12px; border-radius: 20px;
            border: 1.5px solid var(--stroke); background: var(--surface);
            color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all .15s;
        }
        .arc-group-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        /* ── Body / loading ── */
        .arc-body { padding: 20px; max-width: 1100px; margin: 0 auto; }
        .arc-loading { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 14px; }
        .arc-spinner {
            width: 34px; height: 34px;
            border: 3px solid var(--stroke); border-top-color: var(--primary);
            border-radius: 50%; animation: arc-spin .7s linear infinite; margin: 0 auto 14px;
        }
        @keyframes arc-spin { to { transform: rotate(360deg); } }

        /* ── Picker ── */
        .arc-picker-title { text-align: center; padding: 40px 0 16px; font-size: 20px; font-weight: 700; color: var(--text-primary); }
        .arc-picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; max-width: 780px; margin: 0 auto 40px; }
        .arc-picker-card {
            background: var(--surface); border: 1px solid var(--stroke);
            border-radius: var(--border-radius); padding: 18px; cursor: pointer;
            transition: transform .15s, box-shadow .15s;
        }
        .arc-picker-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.1); }
        .arc-picker-card-icon { font-size: 32px; margin-bottom: 8px; }
        .arc-picker-card-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }
        .arc-picker-card-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        /* ── Schedule ── */
        .arc-round-section { margin-bottom: 24px; }
        .arc-round-title {
            font-size: 12px; font-weight: 700; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: .07em;
            padding: 8px 0 10px; display: flex; align-items: center; gap: 8px;
        }
        .arc-round-count {
            font-size: 11px; background: var(--bg); border: 1px solid var(--stroke);
            border-radius: 10px; padding: 1px 8px; color: var(--text-secondary); font-weight: 600;
        }
        .arc-matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

        /* ── Predictions tab ── */
        .pred-match-item { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--border-radius); margin-bottom: 8px; overflow: hidden; }
        .pred-match-hdr {
            padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            transition: background .1s;
        }
        .pred-match-hdr:hover { background: var(--bg); }
        .pred-match-teams { flex: 1; min-width: 0; }
        .pred-match-name { font-size: 13px; font-weight: 700; color: var(--text-primary); }
        .pred-match-round { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
        .pred-match-result { font-size: 16px; font-weight: 800; color: var(--text-primary); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .pred-stat-chips { display: flex; gap: 5px; flex-wrap: wrap; }
        .pred-stat-chip {
            font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; white-space: nowrap;
        }
        .chip-exact { background: #D1FAE5; color: #065F46; }
        .chip-rank  { background: #DBEAFE; color: #1E40AF; }
        .chip-zero  { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--stroke); }
        .pred-chevron { color: var(--text-secondary); font-size: 11px; transition: transform .2s; flex-shrink: 0; }
        .pred-chevron.open { transform: rotate(90deg); }
        .pred-body { display: none; border-top: 1px solid var(--stroke); }
        .pred-body.open { display: block; }
        .pred-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .pred-table th, .pred-table td { padding: 8px 14px; text-align: left; border-bottom: 1px solid var(--stroke); }
        .pred-table th { font-size: 11px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; background: var(--bg); }
        .pred-table tr:last-child td { border-bottom: none; }
        .pred-pts-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 11px; }
        .pts-exact { background: #D1FAE5; color: #065F46; }
        .pts-rank  { background: #DBEAFE; color: #1E40AF; }
        .pts-zero  { background: var(--bg); color: var(--text-secondary); }
        .pred-score-right { color: #059669; font-weight: 700; }
        .pred-score-wrong { color: var(--text-secondary); }

        /* ── Leaderboard ── */
        .arc-bxh-card { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--border-radius); overflow: hidden; margin-bottom: 20px; }
        .arc-bxh-title { padding: 14px 18px; border-bottom: 1px solid var(--stroke); font-weight: 700; font-size: 14px; }
        .arc-bxh-table { width: 100%; border-collapse: collapse; }
        .arc-bxh-table th, .arc-bxh-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--stroke); }
        .arc-bxh-table th { font-size: 11px; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; background: var(--bg); }
        .arc-bxh-table tbody tr:last-child td { border-bottom: none; }
        .arc-bxh-table tbody tr:hover { background: var(--bg); }
        .arc-rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 12px; font-weight: 700; }
        .rank-1 { background: #FEF3C7; color: #92400E; }
        .rank-2 { background: #F3F4F6; color: #374151; }
        .rank-3 { background: #FEE2E2; color: #9B1C1C; }
        .arc-pts { font-size: 16px; font-weight: 800; color: var(--text-primary); }
        .arc-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }

        /* ── Chart ── */
        .arc-chart-section { margin-bottom: 32px; }
        .arc-chart-group-title {
            font-size: 14px; font-weight: 700; color: var(--text-primary);
            padding: 12px 0 8px; border-bottom: 2px solid var(--primary); margin-bottom: 16px;
        }
        .arc-bar-chart { padding: 4px 0 12px; }
        .arc-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
        .arc-bar-rank { width: 22px; font-size: 12px; font-weight: 700; color: var(--text-secondary); text-align: right; flex-shrink: 0; }
        .arc-bar-label { width: 110px; min-width: 110px; font-size: 12px; font-weight: 600; color: var(--text-primary); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
        .arc-bar-track { flex: 1; height: 22px; background: var(--bg); border-radius: 11px; overflow: hidden; border: 1px solid var(--stroke); position: relative; }
        .arc-bar-fill { height: 100%; border-radius: 11px; min-width: 24px; display: flex; align-items: center; justify-content: flex-end; }
        .arc-bar-val { font-size: 11px; font-weight: 700; padding: 0 9px; color: #fff; white-space: nowrap; }

        /* Bracket prediction overlay */
        .bracket-pred-row {
            margin: 3px 6px 4px; display: flex; gap: 5px; flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .arc-body { padding: 14px 12px; }
            .arc-tabs { padding: 0 10px; }
            .arc-tab { padding: 10px 12px; font-size: 12px; }
            .arc-bar-label { width: 80px; min-width: 80px; }
            .arc-matches-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

// ================================================================

// ================================================================
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.arc-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => { p.style.display = 'none'; p.classList.remove('active'); });
    document.querySelector(`.arc-tab[onclick="switchTab('${tab}')"]`)?.classList.add('active');
    const panel = document.getElementById('tab-' + tab);
    if (panel) { panel.style.display = 'block'; panel.classList.add('active'); }

    // Group bar visibility
    const gb = document.getElementById('arcGroupBar');
    if (gb) gb.style.display = ['predictions','leaderboard','chart'].includes(tab) && predGroups.length > 1 ? 'flex' : 'none';

    if (tab === 'schedule')     renderSchedule();
    else if (tab === 'standings') setTimeout(renderGroupStandings, 10);
    else if (tab === 'bracket')   renderBracketTab();
    else if (tab === 'predictions') renderPredictionsTab();
    else if (tab === 'leaderboard') renderLeaderboard();
    else if (tab === 'chart')       renderChartTab();
}

function renderGroupBar() {
    const bar = document.getElementById('arcGroupBar');
    if (!bar) return;
    const allBtn = `<button class="arc-group-btn${currentGroup === null ? ' active' : ''}" onclick="selectGroup(null)">Tất cả</button>`;
    bar.innerHTML = '<span class="arc-group-label">Nhóm:</span>' + allBtn +
        predGroups.map(g => `<button class="arc-group-btn${g === currentGroup ? ' active' : ''}" onclick="selectGroup('${g.replace(/'/g,"\\'")}')"> ${g}</button>`).join('');
}
function selectGroup(g) {
    currentGroup = g;
    renderGroupBar();
    if (currentTab === 'predictions') renderPredictionsTab();
    else if (currentTab === 'leaderboard') renderLeaderboard();
    else if (currentTab === 'chart') renderChartTab();
    else if (currentTab === 'bracket' && predLoaded) injectBracketPredStats();
}

// ================================================================
// LAZY LOAD PREDICTIONS
// ================================================================
async function ensurePredictions(container) {
    if (predLoaded) return true;
    if (currentTournamentId === 'demo') return true;
    const sb = getSB();
    if (!sb) {
        if (container) container.innerHTML = '<div class="arc-loading">Không thể kết nối database.</div>';
        return false;
    }
    if (container) container.innerHTML = '<div class="arc-loading"><div class="arc-spinner"></div>Đang tải dữ đoán...</div>';
    const { data, error } = await sb
        .from('archive_predictions').select('*').eq('tournament_id', currentTournamentId);
    if (error) {
        if (container) container.innerHTML = `<div class="arc-loading">Lỗi: ${error.message}</div>`;
        return false;
    }
    archivePredictions = data || [];
    predLoaded = true;
    return true;
}

// ================================================================
// LOAD TOURNAMENT
// ================================================================
async function loadTournament(id) {
    currentTournamentId = id;
    predLoaded = false;
    archivePredictions = [];

    const loading = document.getElementById('arcLoading');
    loading.style.display = 'block';
    loading.innerHTML = '<div class="arc-spinner"></div>Đang tải dữ liệu...';
    document.getElementById('arcPicker').style.display = 'none';
    document.getElementById('arcTabs').style.display = 'none';

    try {
        let tournament, rawMatches, players;

        if (id === 'demo') {
            const mock = generateMockData();
            tournament = mock.tournament;
            rawMatches = mock.matches;
            players = mock.archivePlayers;
            archivePredictions = mock.archivePredictions;
            predLoaded = true;
        } else {
            const sb = getSB();
            if (!sb) throw new Error('Không thể kết nối database. Vui lòng thử lại.');

            const { data: t, error: tErr } = await sb
                .from('archive_tournaments').select('*').eq('id', id).single();
            if (tErr || !t) throw new Error('Không tìm thấy giải đấu này.');
            tournament = t;

            const { data: rm, error: mErr } = await sb
                .from('archive_matches').select('*').eq('tournament_id', id).order('match_date');
            if (mErr) throw mErr;
            rawMatches = rm;

            const { data: pl, error: pErr } = await sb
                .from('archive_players').select('*').eq('tournament_id', id).order('total_points',{ascending:false});
            if (pErr) throw pErr;
            players = pl;
        }

        archivePlayers = players || [];
        predGroups = [...new Set(archivePlayers.map(p=>p.group_name).filter(Boolean))].sort();
        currentGroup = predGroups[0] || null;

        // Map to bracket-render.js format
        matches = (rawMatches || []).map(m => ({
            ...m,
            id: m.match_number != null ? String(m.match_number) : String(m.id || ''),
            home: m.home_team, away: m.away_team, group: m.match_group,
            date: m.match_date ? new Date(m.match_date) : new Date(),
            actualScore: (m.home_score !== null && m.home_score !== undefined) ? {
                homeScore: m.home_score, awayScore: m.away_score, minute: m.minute,
                home_penalty: m.home_penalty, away_penalty: m.away_penalty
            } : null
        }));

        // Header
        document.getElementById('arcTitle').textContent = tournament.name;
        const uniquePl = new Set(archivePlayers.map(p => p.player_id || p.name)).size;
        const grpText  = predGroups.length > 0 ? ` · ${predGroups.length} nhóm dự đoán` : '';
        document.getElementById('arcSub').textContent =
            `Lưu: ${new Date(tournament.archived_at).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Ho_Chi_Minh'})} · ${matches.length} trận · ${uniquePl} người chơi${grpText}`;
        document.title = tournament.name + ' — Archive';

        if (predGroups.length > 1) renderGroupBar();

        window.history.replaceState({}, '', `?t=${id}`);

        loading.style.display = 'none';
        document.getElementById('arcTabs').style.display = 'flex';

        // Activate first tab
        switchTab('schedule');

    } catch(err) {
        loading.style.display = 'block';
        loading.innerHTML = `<div style="font-size:32px;margin-bottom:14px;">⚠️</div><div style="color:var(--text-secondary);">${err.message || String(err)}</div>`;
    }
}

function renderSchedule() {
    const container = document.getElementById('tab-schedule');
    if (!container) return;

    const byRound = {};
    matches.forEach(m => {
        const rnd = m.match_group || m.group || 'OTHER';
        if (!byRound[rnd]) byRound[rnd] = [];
        byRound[rnd].push(m);
    });

    const keys = ROUND_ORDER.filter(r => byRound[r]);
    const extra = Object.keys(byRound).filter(r => !ROUND_ORDER.includes(r));
    let html = '';
    [...keys, ...extra].forEach(rnd => {
        const rndMatches = byRound[rnd].sort((a,b) => new Date(a.match_date||a.date) - new Date(b.match_date||b.date));
        const finished = rndMatches.filter(m => m.status === 'finished').length;
        html += `<div class="arc-round-section">
            <div class="arc-round-title">
                ${ROUND_EMOJIS[rnd]||'⚽'} ${ROUND_LABELS[rnd]||rnd}
                <span class="arc-round-count">${finished}/${rndMatches.length} kết quả</span>
            </div>
            <div class="arc-matches-grid" id="arc-grid-${rnd}"></div>
        </div>`;
    });
    container.innerHTML = html || '<div class="arc-loading">Không có dữ liệu trận đấu.</div>';

    [...keys, ...extra].forEach(rnd => {
        const grid = document.getElementById(`arc-grid-${rnd}`);
        if (!grid) return;
        byRound[rnd].sort((a,b) => new Date(a.match_date||a.date) - new Date(b.match_date||b.date)).forEach(m => {
            const card = renderMatchRowCard(m);
            card.style.cursor = 'default';
            card.onclick = null;
            grid.appendChild(card);
        });
    });
}

function injectBracketPredStats() {
    if (!archivePredictions.length) return;
    document.querySelectorAll('.bracket-mini-card').forEach(card => {
        // Remove previous stat rows
        card.querySelectorAll('.bracket-pred-row').forEach(el => el.remove());

        const matchId = card.getAttribute('data-match-id');
        const matchNum = parseInt(matchId);
        if (isNaN(matchNum)) return;

        const pool = currentGroup
            ? archivePredictions.filter(p => p.match_number === matchNum && p.group_name === currentGroup)
            : archivePredictions.filter(p => p.match_number === matchNum);

        // Deduplicate by player_id (or player_name) when showing "all groups"
        const seen = new Set();
        const unique = pool.filter(p => {
            const k = (p.player_id || p.player_name) + '::' + (currentGroup ? p.group_id : 'all');
            if (seen.has(k)) return false;
            seen.add(k); return true;
        });

        if (unique.length === 0) return;

        const exactN = unique.filter(p => (p.points_exact_score || 0) > 0).length;
        const rankN  = unique.filter(p => (p.points_rank || 0) > 0 && !(p.points_exact_score > 0)).length;
        const total  = unique.length;

        const row = document.createElement('div');
        row.className = 'bracket-pred-row';
        let chips = '';
        if (exactN > 0)
            chips += `<span class="pred-stat-chip chip-exact">✓✓ ${exactN}/${total} tỉ số</span>`;
        if (rankN > 0)
            chips += `<span class="pred-stat-chip chip-rank">✓ ${rankN}/${total} kq</span>`;
        if (exactN === 0 && rankN === 0)
            chips += `<span class="pred-stat-chip chip-zero">0/${total} đúng</span>`;
        row.innerHTML = chips;
        card.appendChild(row);
    });
}

function overrideBracketClicks() {
    document.querySelectorAll('.bracket-mini-card').forEach(card => {
        const matchId = card.getAttribute('data-match-id');
        const matchNum = parseInt(matchId);
        if (isNaN(matchNum)) { card.style.cursor = 'default'; return; }
        card.style.cursor = 'pointer';
        card.onclick = () => {
            switchTab('predictions');
            setTimeout(() => expandMatchPred(matchNum), 80);
        };
    });
}

// ================================================================
// TAB: DỰ ĐOÁN — per-match prediction breakdown
// ================================================================
async function renderPredictionsTab() {
    const container = document.getElementById('tab-predictions');
    if (!container) return;

    const ok = await ensurePredictions(container);
    if (!ok) return;

    const finishedMatches = matches.filter(m => m.status === 'finished')
        .sort((a, b) => new Date(a.match_date || a.date) - new Date(b.match_date || b.date));

    if (finishedMatches.length === 0) {
        container.innerHTML = '<div class="arc-loading">Chưa có trận đấu kết thúc.</div>';
        return;
    }

    const html = finishedMatches.map(m => {
        const matchNum = m.match_number || parseInt(m.id);
        const pool = archivePredictions.filter(p =>
            p.match_number === matchNum && (!currentGroup || p.group_name === currentGroup)
        );
        const exactN = pool.filter(p => (p.points_exact_score||0) > 0).length;
        const rankN  = pool.filter(p => (p.points_rank||0) > 0 && !((p.points_exact_score||0)>0)).length;
        const scoreStr = `${m.home_score}–${m.away_score}`;
        const chips = pool.length > 0
            ? (exactN > 0 ? `<span class="pred-stat-chip chip-exact">✓✓ ${exactN}</span>` : '') +
              (rankN  > 0 ? `<span class="pred-stat-chip chip-rank">✓ ${rankN}</span>`   : '') +
              (exactN === 0 && rankN === 0 ? `<span class="pred-stat-chip chip-zero">0 đúng</span>` : '')
            : `<span class="pred-stat-chip chip-zero">Chưa có dự đoán</span>`;
        const rndLabel = ROUND_LABELS[m.match_group || m.group] || (m.match_group || m.group || '');
        return `<div class="pred-match-item" id="pred-item-${matchNum}">
            <div class="pred-match-hdr" onclick="toggleMatchPred(${matchNum})">
                <div class="pred-match-teams">
                    <div class="pred-match-name">${m.home_team||m.home} vs ${m.away_team||m.away}</div>
                    <div class="pred-match-round">${rndLabel}${m.match_number ? ' · M'+m.match_number : ''}</div>
                </div>
                <div class="pred-match-result">${scoreStr}</div>
                <div class="pred-stat-chips">${chips}</div>
                <span class="pred-chevron" id="chev-${matchNum}">▶</span>
            </div>
            <div class="pred-body" id="pred-body-${matchNum}"></div>
        </div>`;
    }).join('');

    container.innerHTML = html;
}

function toggleMatchPred(matchNum) {
    const body  = document.getElementById('pred-body-' + matchNum);
    const chev  = document.getElementById('chev-' + matchNum);
    if (!body) return;
    const isOpen = body.classList.contains('open');
    if (isOpen) {
        body.classList.remove('open');
        if (chev) chev.classList.remove('open');
    } else {
        body.classList.add('open');
        if (chev) chev.classList.add('open');
        if (!body.dataset.rendered) {
            body.dataset.rendered = '1';
            renderMatchPredTable(matchNum, body);
        }
    }
}

function expandMatchPred(matchNum) {
    // Scroll to + open
    const item = document.getElementById('pred-item-' + matchNum);
    if (item) {
        item.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setTimeout(() => toggleMatchPred(matchNum), 100);
    }
}

function renderMatchPredTable(matchNum, container) {
    const m = matches.find(x => (x.match_number || parseInt(x.id)) === matchNum);
    const actualH = m ? m.home_score : null;
    const actualA = m ? m.away_score : null;

    const pool = archivePredictions.filter(p =>
        p.match_number === matchNum && (!currentGroup || p.group_name === currentGroup)
    );

    if (pool.length === 0) {
        container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--text-secondary);">Không có dự đoán nào.</div>';
        return;
    }

    const sorted = [...pool].sort((a,b) => (b.total_points||0) - (a.total_points||0));

    const showGroup = !currentGroup && predGroups.length > 1;
    const rows = sorted.map(p => {
        const predStr = (p.home_score !== null && p.away_score !== null)
            ? `${p.home_score}–${p.away_score}` : '–';
        const isExact = (p.points_exact_score||0) > 0;
        const isRank  = (p.points_rank||0) > 0 && !isExact;
        const pts = p.total_points || 0;
        const ptsClass = isExact ? 'pts-exact' : isRank ? 'pts-rank' : 'pts-zero';
        const scoreClass = isExact ? 'pred-score-right' : isRank ? 'pred-score-right' : 'pred-score-wrong';
        return `<tr>
            <td style="font-weight:600;">${p.player_name}</td>
            ${showGroup ? `<td style="font-size:11px;color:var(--text-secondary);">${p.group_name||''}</td>` : ''}
            <td class="${scoreClass}">${predStr}</td>
            <td><span class="pred-pts-badge ${ptsClass}">+${pts}</span></td>
        </tr>`;
    }).join('');

    const resultStr = (actualH !== null && actualA !== null) ? `${actualH}–${actualA}` : '?';
    container.innerHTML = `
        <div style="padding:8px 14px;font-size:11px;color:var(--text-secondary);background:var(--bg);">
            Kết quả thực tế: <strong style="color:var(--text-primary);font-size:13px;">${resultStr}</strong>
            · ${sorted.length} dự đoán
        </div>
        <div style="overflow-x:auto;">
            <table class="pred-table">
                <thead><tr>
                    <th>Người chơi</th>
                    ${showGroup ? '<th>Nhóm</th>' : ''}
                    <th>Dự đoán</th>
                    <th>Điểm</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
}

// ================================================================
// TAB: BẢNG ĐIỂM
// ================================================================
function renderLeaderboard() {
    const container = document.getElementById('tab-leaderboard');
    if (!container) return;

    if (archivePlayers.length === 0) {
        container.innerHTML = '<div class="arc-loading">Không có dữ liệu người chơi.</div>';
        return;
    }

    const groupsToShow = currentGroup ? [currentGroup] : predGroups;
    let html = '';

    groupsToShow.forEach(grp => {
        const pool = archivePlayers.filter(p => !grp || p.group_name === grp);
        if (pool.length === 0) return;

        const sorted = [...pool].sort((a,b) =>
            b.total_points - a.total_points ||
            b.exact_score_count - a.exact_score_count ||
            b.top1_count - a.top1_count
        );

        const rows = sorted.map((p, i) => {
            const rankBadge = i < 3
                ? `<span class="arc-rank-badge rank-${i+1}">${['🥇','🥈','🥉'][i]}</span>`
                : `<span class="arc-rank-badge" style="color:var(--text-secondary);">${i+1}</span>`;
            const flagHTML = p.favorite_team ? getFlagHTML(p.favorite_team, 18) : '';
            return `<tr>
                <td>${rankBadge}</td>
                <td style="font-weight:600;">${p.name}</td>
                <td><span class="arc-pts">${p.total_points}</span></td>
                <td><span class="arc-badge" style="background:#FEF3C7;color:#92400E;">${p.exact_score_count}</span></td>
                <td><span class="arc-badge" style="background:#EDE9FE;color:#5B21B6;">${p.top1_count}</span></td>
                <td>
                    <div style="display:flex;align-items:center;gap:5px;">
                        <span style="display:inline-flex;width:20px;height:20px;border-radius:50%;overflow:hidden;align-items:center;justify-content:center;">${flagHTML}</span>
                        <span style="font-size:12px;color:var(--text-secondary);">${p.favorite_team||'—'}</span>
                        ${p.favorite_points ? `<span class="arc-badge" style="background:#D1FAE5;color:#065F46;">+${p.favorite_points}</span>` : ''}
                    </div>
                </td>
            </tr>`;
        }).join('');

        html += `<div class="arc-bxh-card">
            <div class="arc-bxh-title">🏅 ${grp} — ${sorted.length} người chơi</div>
            <div style="overflow-x:auto;">
                <table class="arc-bxh-table">
                    <thead><tr>
                        <th style="width:36px;">#</th>
                        <th>Tên</th><th>Điểm</th>
                        <th>Đúng tỉ số</th><th>Đúng kq</th><th>Đội yêu thích</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        </div>`;
    });

    container.innerHTML = html || '<div class="arc-loading">Không có dữ liệu.</div>';
}

// ================================================================
// TAB: TIẾN ĐỘ — bar chart (final ranking) + line chart (progression)
// ================================================================
const CHART_COLORS = ['#6366F1','#F59E0B','#10B981','#EF4444','#8B5CF6','#EC4899','#3B82F6','#14B8A6','#F97316','#84CC16'];
const BAR_COLORS   = ['#EAB308','#94A3B8','#F87171','#60A5FA','#A78BFA','#34D399','#F472B6','#2DD4BF','#FB923C','#A3E635'];
const LINE_ROUNDS  = ['Vòng bảng','Vòng 32','Vòng 16','Tứ kết','Bán kết','Chung kết'];

function getMatchRoundIdx(num) {
    if (!num) return null;
    if (num >= 1  && num <= 72)  return 0;
    if (num >= 73 && num <= 88)  return 1;
    if (num >= 89 && num <= 96)  return 2;
    if (num >= 97 && num <= 100) return 3;
    if (num >= 101&& num <= 102) return 4;
    if (num >= 103&& num <= 104) return 5;
    return null;
}

async function renderChartTab() {
    const container = document.getElementById('tab-chart');
    if (!container) return;

    const ok = await ensurePredictions(container);
    if (!ok) return;

    // Tất cả trận đã kết thúc, sắp xếp theo ngày
    const finishedMatches = matches
        .filter(m => m.actualScore !== null)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

    const groupsToShow = currentGroup ? [currentGroup] : predGroups;
    let html = '';

    groupsToShow.forEach(grp => {
        const playerPool = archivePlayers.filter(p => p.group_name === grp);
        if (playerPool.length === 0) return;

        const sorted = [...playerPool].sort((a,b) => b.total_points - a.total_points);
        const maxPts = sorted[0]?.total_points || 1;

        // Bar chart rows
        const barRows = sorted.map((p, i) => {
            const pct = Math.max(4, Math.round((p.total_points / maxPts) * 100));
            const color = BAR_COLORS[i % BAR_COLORS.length];
            return `<div class="arc-bar-row">
                <span class="arc-bar-rank" style="color:${i<3?['#EAB308','#94A3B8','#F87171'][i]:'var(--text-secondary)'};">${i+1}</span>
                <span class="arc-bar-label">${p.name}</span>
                <div class="arc-bar-track">
                    <div class="arc-bar-fill" style="width:${pct}%;background:${color};">
                        <span class="arc-bar-val">${p.total_points}đ</span>
                    </div>
                </div>
            </div>`;
        }).join('');

        if (finishedMatches.length === 0) {
            html += `<div class="arc-chart-section">
                <div class="arc-chart-group-title">📊 ${grp}</div>
                <div class="arc-bar-chart">${barRows}</div>
                <div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:13px;">Chưa có trận kết thúc.</div>
            </div>`;
            return;
        }

        const top8 = sorted.slice(0, 8);
        const keyOf = p => (p.player_id || p.name) + '::' + (p.group_id || grp);
        const predKeyOf = pred => (pred.player_id || pred.player_name) + '::' + (pred.group_id || grp);
        const playerSet = new Set(top8.map(keyOf));

        // Lookup: "match_number::playerKey" → điểm
        const predLookup = {};
        archivePredictions.filter(pred => pred.group_name === grp).forEach(pred => {
            const pk = predKeyOf(pred);
            if (!playerSet.has(pk)) return;
            const k = `${pred.match_number}::${pk}`;
            predLookup[k] = (predLookup[k] || 0) + (pred.total_points || 0);
        });

        // Tích lũy điểm theo từng trận
        const running = {};
        const cumulPts = {};
        top8.forEach(p => { running[keyOf(p)] = 0; cumulPts[keyOf(p)] = []; });
        finishedMatches.forEach(m => {
            top8.forEach(p => {
                const pk = keyOf(p);
                running[pk] += predLookup[`${m.match_number}::${pk}`] || 0;
                cumulPts[pk].push(running[pk]);
            });
        });

        const N = finishedMatches.length;
        const W = Math.max(660, N * 9 + 140);
        const H = 280;
        const PAD = { top: 18, right: 80, bottom: 38, left: 48 };
        const cW = W - PAD.left - PAD.right, cH = H - PAD.top - PAD.bottom;
        const maxV = Math.max(...top8.map(p => cumulPts[keyOf(p)][N-1] || 0), 10);
        const xOf = i => PAD.left + (N > 1 ? (i / (N-1)) * cW : cW / 2);
        const yOf = v => PAD.top + cH - (v / maxV) * cH;

        // Đường kẻ ngang
        let gridSvg = '';
        for (let g = 0; g <= 4; g++) {
            const v = Math.round(maxV / 4 * g);
            const y = yOf(v);
            gridSvg += `<line x1="${PAD.left}" y1="${y}" x2="${PAD.left+cW}" y2="${y}" stroke="var(--stroke)" stroke-width="1" ${g>0?'stroke-dasharray="3,3"':""}/>`;
            gridSvg += `<text x="${PAD.left-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--text-secondary)">${v}</text>`;
        }

        // Đường kẻ dọc phân vòng đấu + nhãn
        const ROUND_LABELS = ['Vòng bảng','Vòng 32','Vòng 16','Tứ kết','Bán kết','Chung kết'];
        let lastRi = -1;
        finishedMatches.forEach((m, i) => {
            const ri = getMatchRoundIdx(m.match_number);
            if (ri === null || ri === lastRi) return;
            lastRi = ri;
            const x = xOf(i);
            if (i > 0) {
                gridSvg += `<line x1="${x.toFixed(1)}" y1="${PAD.top}" x2="${x.toFixed(1)}" y2="${PAD.top+cH}" stroke="var(--stroke)" stroke-width="1" stroke-dasharray="4,3"/>`;
            }
            gridSvg += `<text x="${(x + (i > 0 ? 3 : 0)).toFixed(1)}" y="${H-6}" text-anchor="start" font-size="9" fill="var(--text-secondary)">${ROUND_LABELS[ri] || ''}</text>`;
        });

        // Đường biểu đồ mỗi player
        const lineSvg = top8.map((p, pi) => {
            const color = CHART_COLORS[pi % CHART_COLORS.length];
            const k = keyOf(p);
            const pts = cumulPts[k];
            if (!pts.length) return '';
            const pathD = pts.map((v, i) => `${i===0?'M':'L'} ${xOf(i).toFixed(1)} ${yOf(v).toFixed(1)}`).join(' ');
            const dots  = N <= 30 ? pts.map((v, i) => `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="3" fill="${color}"/>`).join('') : '';
            const lastY = yOf(pts[N-1]);
            return `<path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                    ${dots}
                    <text x="${(xOf(N-1)+7).toFixed(1)}" y="${(lastY+4).toFixed(1)}" font-size="10" fill="${color}" font-weight="700">${pts[N-1]}</text>`;
        }).join('');

        const legend = top8.map((p, pi) => {
            const color = CHART_COLORS[pi % CHART_COLORS.length];
            return `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;margin-right:12px;margin-bottom:4px;">
                <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block;"></span>${p.name}
            </span>`;
        }).join('');

        html += `<div class="arc-chart-section">
            <div class="arc-chart-group-title">📊 ${grp}</div>
            <div class="arc-bar-chart">${barRows}</div>
            <div style="margin-top:20px;background:var(--surface);border:1px solid var(--stroke);border-radius:var(--border-radius);padding:16px;">
                <div style="font-size:13px;font-weight:700;margin-bottom:4px;">📈 Tích lũy điểm theo trận · Top ${top8.length}</div>
                <div style="font-size:11px;color:var(--text-secondary);margin-bottom:10px;">Điểm cộng dồn qua ${N} trận đã kết thúc</div>
                <div style="overflow-x:auto;">
                    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;min-width:${W}px;">
                        ${gridSvg}${lineSvg}
                    </svg>
                </div>
                <div style="margin-top:8px;display:flex;flex-wrap:wrap;">${legend}</div>
            </div>
        </div>`;
    });

    container.innerHTML = html || '<div class="arc-loading">Không có dữ liệu.</div>';
}

// ================================================================
// SHOW ERROR
// ================================================================
function showError(msg) {
    const el = document.getElementById('arcLoading');
    if (el) {
        el.style.display = 'block';
        el.innerHTML = `<div style="font-size:26px;margin-bottom:12px;">⚠️</div>
            <div style="font-size:13px;color:var(--text-secondary);word-break:break-all;max-width:600px;margin:0 auto;">${msg}</div>`;
    }
}

// ================================================================
// START
// ================================================================
window.onerror = function(msg, src, line) { showError(msg + '<br><small>' + src + ':' + line + '</small>'); return true; };
window.addEventListener('unhandledrejection', e => showError('Async error: ' + (e.reason?.message || String(e.reason))));
init();
</script>
